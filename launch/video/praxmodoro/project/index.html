<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Praxmodoro demo</title>
    <!-- GSAP is vendored (assets/vendor) so the film renders offline. -->
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e4eef9;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e4eef9;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      Praxmodoro demo (silent). Seven rooms, one per storyboard frame (see STORYBOARD.md).
      Footage is linked, not copied: assets/footage -> /mnt/project-files/launch/video/praxmodoro/footage
      End-card text lives in compositions/frames/07-join.html (data-composition-variables).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="55.7"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="el-01-open"
        class="scene"
        data-composition-id="01-open"
        data-composition-src="compositions/frames/01-open.html"
        data-start="0"
        data-duration="7.2"
        data-track-index="0"
      ></div>
      <div
        id="el-02-begin"
        class="scene"
        data-composition-id="02-begin"
        data-composition-src="compositions/frames/02-begin.html"
        data-start="6"
        data-duration="11.4"
        data-track-index="1"
      ></div>
      <div
        id="el-03-focus"
        class="scene"
        data-composition-id="03-focus"
        data-composition-src="compositions/frames/03-focus.html"
        data-start="16.2"
        data-duration="11.8"
        data-track-index="0"
      ></div>
      <div
        id="el-04-checkin"
        class="scene"
        data-composition-id="04-checkin"
        data-composition-src="compositions/frames/04-checkin.html"
        data-start="26.8"
        data-duration="9"
        data-track-index="1"
      ></div>
      <div
        id="el-05-break"
        class="scene"
        data-composition-id="05-break"
        data-composition-src="compositions/frames/05-break.html"
        data-start="34.6"
        data-duration="9.2"
        data-track-index="0"
      ></div>
      <div
        id="el-06-review"
        class="scene"
        data-composition-id="06-review"
        data-composition-src="compositions/frames/06-review.html"
        data-start="42.6"
        data-duration="8"
        data-track-index="1"
      ></div>
      <div
        id="el-07-join"
        class="scene"
        data-composition-id="07-join"
        data-composition-src="compositions/frames/07-join.html"
        data-start="49.2"
        data-duration="6.5"
        data-track-index="0"
      ></div>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-open", { opacity: 0, duration: 1.2, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-begin", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 6);
        tl.to("#el-02-begin", { opacity: 0, duration: 1.2, ease: "power2.inOut" }, 16.2);
        tl.fromTo("#el-03-focus", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 16.2);
        tl.to("#el-03-focus", { opacity: 0, duration: 1.2, ease: "power2.inOut" }, 26.8);
        tl.fromTo("#el-04-checkin", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 26.8);
        tl.to("#el-04-checkin", { opacity: 0, duration: 1.2, ease: "power2.inOut" }, 34.6);
        tl.fromTo("#el-05-break", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 34.6);
        tl.to("#el-05-break", { opacity: 0, duration: 1.2, ease: "power2.inOut" }, 42.6);
        tl.fromTo("#el-06-review", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 42.6);
        tl.to("#el-06-review", { opacity: 0, duration: 1.4, ease: "power2.inOut" }, 49.2);
        tl.fromTo("#el-07-join", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power2.inOut" }, 49.2);
        tl.to({}, { duration: 55.7 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
