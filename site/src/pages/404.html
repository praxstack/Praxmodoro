<!-- @page {"title": "Page not found · Praxmodoro", "description": "This page isn't here. Head back to Praxmodoro, a calm focus timer for Mac.", "path": "/404.html"} -->
<!doctype html>
<html lang="en">
<head>
{{> head}}
<meta name="robots" content="noindex">
</head>
<body class="plain-page">
{{> header}}
<main id="main">
  <div class="notice">
    <span class="light light-small" aria-hidden="true">{{> light}}</span>
    <h1>A detour, not a failure.</h1>
    <p>The page you were looking for isn&rsquo;t here (error 404). It may have moved, or the link may have a typo. Your place on the main page is right where you left it.</p>
    <p><a class="button button-primary" href="/">Back to Praxmodoro</a></p>
  </div>
</main>
{{> footer}}
</body>
</html>
